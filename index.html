<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>探究の進め方アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 落ち着いた学校の道具。生徒が迷わず「今ここ」と「次の一歩」を見つける
   IDEA: 探究の進め方マップ（A3の紙）を、押せる地図と手帳にしたもの
   PICTURE: 3列×段階のマップそのもの。押したコマの中身が下に開く
   COLOUR and TYPE: 白い紙＋研究系の紫・行動系の緑・創作系の赤茶。BIZ UDPゴシック
   LAYOUT: 上に切り替えと見出し、マップ→詳細。600px以下は列を縦に積む */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141416);--paper:light-dark(#f6f5f0,#1d1d21);--ink:light-dark(#222222,#ececea);--mut:light-dark(#5f5e5a,#a9a8a2);--line:light-dark(#d3d1c7,#3a3a40);
--r:light-dark(#534AB7,#AFA9EC);--rt:light-dark(#EEEDFE,#26215C);--a:light-dark(#0F6E56,#5DCAA5);--at:light-dark(#E1F5EE,#04342C);--c:light-dark(#993C1D,#F0997B);--ct:light-dark(#FAECE7,#4A1B0C);--hi:light-dark(#222222,#f1efe8)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(4vw,14px)}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0;line-height:1.2}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.mode button{border:0;background:none;padding:8px 16px;min-height:40px;cursor:pointer}
.mode button[aria-pressed=true]{background:var(--hi);color:var(--bg)}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
nav a{flex:none;text-decoration:none;color:var(--ink);padding:8px 14px;border-radius:8px;min-height:40px;display:flex;align-items:center}
nav a[aria-current=page]{background:var(--paper);font-weight:700}
main{padding:20px max(4vw,14px) 60px;max-width:1240px;margin:0 auto}
h2{font-size:28px;line-height:1.15;margin:0 0 6px}h3{font-size:18px;margin:22px 0 8px}
.lead{color:var(--mut);margin:0 0 16px}
.note{font-size:14px;color:var(--mut)}
.map{display:grid;grid-template-columns:7em repeat(3,minmax(0,1fr));gap:8px 12px;align-items:stretch}
.ph{font-size:13px;color:var(--mut);display:flex;align-items:center;justify-content:center;text-align:center}
.cell{border:1.5px solid;border-radius:10px;padding:16px 12px 6px;cursor:pointer;text-align:center;background:var(--t);border-color:var(--k);color:var(--k);min-height:76px;display:flex;flex-direction:column;justify-content:center;position:relative}
.cell b{font-size:17px}.cell small{font-size:13px}
.cell .lab{position:absolute;left:8px;top:5px;font-size:12px;font-weight:700}
.cell .ref{display:block;text-align:right;font-size:12px;margin-top:2px}
.cell.here::after{content:"今ここ";position:absolute;right:8px;top:4px;font-size:12px;font-weight:700}
.cell[aria-expanded=true]{outline:3px solid var(--k);outline-offset:2px}
.R{--k:var(--r);--t:var(--rt)}@media(max-width:600px){.map .cell{order:var(--o)}}.A{--k:var(--a);--t:var(--at)}.C{--k:var(--c);--t:var(--ct)}
.A .cell,.cell.A{border-style:dashed}.cell.C{border-style:dotted;border-width:2.5px}
.start{grid-column:2/5;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-weight:700}
.detail{margin-top:18px;border:1.5px solid var(--k);border-radius:12px;padding:16px 18px;background:var(--bg)}
.detail h3{margin-top:0;color:var(--k)}
.star{font-weight:700;padding:8px 12px;border-radius:8px;background:var(--t);color:var(--k);margin:6px 0}
.opt{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0}
.ask{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;min-height:44px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.btn.p{background:var(--hi);color:var(--bg);border-color:var(--hi)}
.two{display:grid;grid-template-columns:15em minmax(0,1fr);gap:24px}
.list{display:flex;flex-direction:column;gap:4px}
.list button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;min-height:42px}
.list button[aria-current=true]{background:var(--paper);font-weight:700}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;background:var(--paper);border-radius:8px;padding:9px 12px;margin:6px 0;display:grid;grid-template-columns:9em minmax(0,1fr);gap:10px}
ol.steps li b::before{content:counter(s) "　"}
table{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--paper)}
.field{margin:12px 0}.field label{font-weight:700;display:block}.field .h{font-size:14px;color:var(--mut)}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);font-size:16px}
textarea{min-height:76px;resize:vertical}
.checks{background:var(--paper);border-radius:10px;padding:12px 14px;margin:14px 0}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
.checks input{width:22px;height:22px;flex:none;margin-top:2px}
.stance{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;font-weight:700}
details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0}summary{cursor:pointer;font-weight:700}
.hist{border-left:3px solid var(--line);padding:4px 12px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--hi);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.tonly{display:none}body.teacher .tonly{display:revert}body.teacher .sonly{display:none}
:focus-visible{outline:3px solid #185FA5;outline-offset:2px}
@media(max-width:600px){h2{font-size:24px}.map{grid-template-columns:minmax(0,1fr)}.ph,.start{display:none}.map .cell{min-height:64px}.two{grid-template-columns:minmax(0,1fr)}.list{flex-direction:row;overflow-x:auto}.list button{flex:none}ol.steps li{grid-template-columns:minmax(0,1fr);gap:2px}
.stack thead{display:none}.stack tr{display:grid;padding-block:8px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mut)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head><body>
<header><div class="top"><h1>探究の進め方</h1>
<div class="mode" role="group" aria-label="使う人"><button id="mS" aria-pressed="true">生徒</button><button id="mT" aria-pressed="false">先生</button></div></div>
<nav id="nav"><a href="#map">マップ</a><a href="#cards">技カード</a><a href="#gates">関門シート</a><a href="#memo" class="sonly">わたしの探究メモ</a><a href="#guide" class="tonly">指導の手引き</a></nav></header>
<main id="main"></main><div class="toast" id="toast" role="status"></div>

  const st=STAR[k+i];
  h+=`<div class="star">★ 迷ったらまずこれ：${esc(st)}</div><p class="note">ほかの動きは必要に応じて選ぶ。必要な相談・許可は確認する。</p><ul>${d.acts.filter(t=>t!==st).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
  if(d.b)h+=`<h3>◆ ${esc(d.b.t)}</h3>${d.b.o.map(o=>`<div class="opt"><b>${esc(o[0])}</b>〔${esc(o[1])}〕<br>${esc(o[2])}</div>`).join('')}`;
  h+=`<div class="ask"><b>${teacher?'先生の問いかけ':'自分に聞くこと'}：</b>${esc(teacher?d.q:(d.qs||d.q))}</div><div class="btns">`;
  h+=nums(waza(k,i)).map(n=>`<a class="btn" href="#card-${n}">技${n} ${esc(cardName(n))}</a>`).join('');
  h+=(KANMON[i]?nums(KANMON[i]):[]).map(n=>`<a class="btn" href="#gate-${n}">関門${n}</a>`).join('');
  if(!teacher)h+=`<button class="btn p" data-here="${id}">今ここにする</button>`;
  return h+`</div></div>`;
}
function secHtml(s){
  if(s.note)return `<p class="note">${esc(s.note)}</p>`;
  let h=`<h3>${esc(s.h)}</h3>`;
  if(s.steps)h+=`<ol class="steps">${s.steps.map(([a,b])=>`<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('')}</ol>`;
  if(s.list)h+=`<ul>${s.list.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
  if(s.table){const T=s.table;h+=`<table class="stack"><thead><tr>${T.head.map(t=>`<th>${esc(t)}</th>`).join('')}</tr></thead><tbody>${T.rows.filter(r=>r.some(x=>x)).map(r=>`<tr>${r.map((x,j)=>`<td data-l="${esc(T.head[j])}">${j===0?'<b>'+esc(x)+'</b>':esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
  return h;
}
function cardsView(){
  const c=CARDS.find(x=>x.no===cardNo)||CARDS[0];
  return `<h2>技カード</h2><p class="lead">困ったときに、今のコマに書いてある番号のカードを開く。</p><div class="two"><div class="list">${CARDS.map(x=>`<button data-card="${x.no}" aria-current="${x.no===c.no}">技${x.no}　${esc(x.title)}</button>`).join('')}</div>
  <article><p class="note">技カード ${c.no}　使うコマ：${esc(c.use)}</p><h2>${esc(c.title)}</h2><p>${esc(c.aim)}</p>${c.sec.map(secHtml).join('')}
  <div class="field"><label for="cardnote">やってみたこと・気づき</label><textarea id="cardnote" data-k="card_${c.no}"></textarea></div></article></div>`;
}
function gatesView(){
  const tabs=`<div class="list" style="flex-direction:row;flex-wrap:wrap;margin-bottom:14px"><button data-gate="0" aria-current="${gateNo===0}">使い方</button>${GATES.map(g=>`<button data-gate="${g.no}" aria-current="${gateNo===g.no}">関門${g.no}</button>`).join('')}</div>`;
  if(!gateNo)return `<h2>関門シート</h2><p class="lead">出発する前に、誰かと一緒に「試運転」してから出る。</p>${tabs}<div class="stance">${esc(STANCE)}</div>
  <h3>流れ</h3><ol class="steps">${FLOW.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join('')}</ol>
  <p class="note">関門2と4の試運転は、続けて1回で。目安は1人5分で交代：目的を説明1分→試して記録の表に入れる2分→分かること・まだ分からないこと1分→一つ直す1分。計画を書く時間や測定の準備は別にとる。出発の前に、必要な許可・同意は「校内の決まり」で別に確認する。</p>
  <h3>試運転の相手の約束</h3><ul>${RULES.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
  <h3>探究の7つの関門</h3><table class="stack"><thead><tr><th></th><th>関門</th><th>いつ</th><th>たどるための問い</th><th>シート</th></tr></thead><tbody>${SEVEN.map(r=>`<tr>${r.map((x,j)=>`<td data-l="${['','関門','いつ','問い','シート'][j]}">${j===1?'<b>'+esc(x)+'</b>':esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const g=gateOf(gateNo);if(!g){gateNo=0;return gatesView()}
  const p=`g${g.no}_`;
  let h=`<h2>関門${g.no}　${esc(g.title)}</h2><p class="note">${esc(g.when)}</p><p class="lead">${esc(g.aim)}</p>${tabs}<h3>${esc(g.writeHead||'書き込む（出発の前に）')}</h3>`;
  h+=g.fields.map(([lab,hint],j)=>`<div class="field"><label for="${p}f${j}">${esc(lab)}</label>${hint?`<div class="h">${esc(hint)}</div>`:''}<textarea id="${p}f${j}" data-k="${p}f${j}"${g.table&&j===g.table.at?` placeholder="${esc(g.table.cols.map(x=>x||'（見出し）').join('｜'))}"`:''}></textarea></div>`).join('');
  h+=`<h3>${esc(g.checkHead||'一緒に確かめる（試運転の相手と）')}</h3><div class="checks">${g.checks.map((t,j)=>`<label><input type="checkbox" data-k="${p}c${j}"><span>${esc(t)}</span></label>`).join('')}<p style="margin:8px 0 0"><b>つながらなかったら → ${esc(g.fail)}</b></p>${g.note?`<p class="note">${esc(g.note)}</p>`:''}</div>`;
  h+=`<div class="field"><label for="${p}pn">試運転の相手</label><input type="text" id="${p}pn" data-k="${p}pn" placeholder="名前"></div>
  <div class="field"><label for="${p}pr">立場</label><select id="${p}pr" data-k="${p}pr"><option value=""></option>${['先輩','友だち','卒業生','先生','その他'].map(x=>`<option>${x}</option>`).join('')}</select></div>
  <div class="field"><label for="${p}pc">ひとこと</label><div class="h">分からなかったこと／詳しい人に相談した方がよさそうなこと</div><textarea id="${p}pc" data-k="${p}pc"></textarea></div>`;
  const L=g.exLabels||['粗い：','通る：'];
  h+=`<details><summary>例を見る</summary><p><b>${esc(L[0])}</b>${esc(g.ex[0])}</p><p><b>${esc(L[1])}</b>${esc(g.ex[1])}</p></details>`;
  return h+`<div class="btns"><button class="btn p" data-copy="gate">このシートをコピー</button><button class="btn" data-clear="${p}">このシートを消す</button></div>`;
}
function gateText(g){const p=`g${g.no}_`;return [`関門${g.no} ${g.title}`].concat(g.fields.map(([lab],j)=>`${lab}\n${get(p+'f'+j)}`)).concat(g.checks.map((t,j)=>`${get(p+'c'+j)?'[x]':'[ ]'} ${t}`)).concat([`試運転の相手：${get(p+'pn')}（${get(p+'pr')}）`,`ひとこと：${get(p+'pc')}`]).join('\n')}
function memoView(){
  const cells=[];KS.forEach(k=>{for(let i=0;i<6;i++)cells.push(k+i)});
  const hist=Array.isArray(store.memo_hist)?store.memo_hist:[];
  return `<h2>わたしの探究メモ</h2><p class="lead">書き直したら「日付をつけて残す」。前の内容は消さずに残ります。</p>
  <div class="field"><label for="mt">テーマ</label><input type="text" id="mt" data-k="memo_theme"></div>
  <div class="field"><label for="mc">今いるコマ</label><select id="mc" data-k="memo_cell"><option value=""></option>${cells.map(id=>`<option value="${id}">${esc(cellName(id))}</option>`).join('')}</select></div>
  ${MEMO.map(([k,l])=>`<div class="field"><label for="${k}">${esc(l)}</label><textarea id="${k}" data-k="${k}"></textarea></div>`).join('')}
  <div class="checks"><label><input type="checkbox" data-k="memo_src"><span>調べた出典を残した（技カード8）</span></label></div>
  <div class="btns"><button class="btn p" data-snap>日付をつけて残す</button><button class="btn" data-copy="memo">メモをコピー</button></div>
  <h3>これまでの記録</h3>${hist.length?hist.slice().reverse().map(e=>`<div class="hist"><b>${esc(e.date)}</b>　${esc(e.cell?cellName(e.cell):'')}<br>${e.memo_theme?`<span class="note">テーマ</span> ${esc(e.memo_theme)}<br>`:''}${MEMO.map(([k,l])=>e[k]?`<span class="note">${esc(l.slice(0,2))}</span> ${esc(e[k])}<br>`:'').join('')}</div>`).join(''):'<p class="note">まだありません。</p>'}`;
}
function memoText(){const cur=[`テーマ：${get('memo_theme')}`,`今いるコマ：${get('memo_cell')?cellName(get('memo_cell')):''}`].concat(MEMO.map(([k,l])=>`${l}\n${get(k)}`));
  const hist=(Array.isArray(store.memo_hist)?store.memo_hist:[]).map(e=>`--- ${e.date} ${e.cell?cellName(e.cell):''}\n`+MEMO.map(([k,l])=>e[k]?`${l}：${e[k]}`:'').filter(Boolean).join('\n'));
  return cur.concat(['','【これまでの記録】']).concat(hist).join('\n')}
function guideView(){
  return `<h2>指導の手引き</h2><p class="lead">全員に全部配らなくてよい。生徒が止まったコマの技カード・関門シートを開く。</p>
  <h3>指導の留意点</h3><ul>${NOTES.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
  <h3>渡し方</h3><ul>${HOW.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
  <h3>生徒の計画や原稿を見るときの問いかけ</h3><table class="stack"><thead><tr><th>技カード</th><th>見るポイント・問いかけ</th></tr></thead><tbody>${TEACHER.map(([a,b])=>`<tr><td data-l="技カード"><b>${esc(a)}</b></td><td data-l="問いかけ">${esc(b)}</td></tr>`).join('')}</tbody></table>
  <h3>校内の決まり（この端末に下書き）</h3><p class="note">学年・担当で話し合って決め、生徒にも配布・掲示する。</p>
  ${LOCAL.map(([t,s],j)=>`<div class="field"><label for="lr${j}">${esc(t)}</label>${s?`<div class="h">${esc(s)}</div>`:''}<textarea id="lr${j}" data-k="local_${j}"></textarea></div>`).join('')}
  <div class="btns"><button class="btn" data-copy="local">校内の決まりをコピー</button></div>`;
}
function render(){
  document.body.classList.toggle('teacher',teacher);
  document.getElementById('mS').setAttribute('aria-pressed',!teacher);document.getElementById('mT').setAttribute('aria-pressed',teacher);
  main.innerHTML=view==='cards'?cardsView():view==='gates'?gatesView():view==='memo'?memoView():view==='guide'?guideView():mapView();
  document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+view?'page':'false'));
  const cur=main.querySelector('.list button[aria-current=true]');if(cur&&window.innerWidth<=600)cur.scrollIntoView({inline:'center',block:'nearest'});
  main.querySelectorAll('[data-k]').forEach(el=>{const v=store[el.dataset.k];if(el.type==='checkbox')el.checked=!!v;else el.value=v??''});
}
function route(){
  let h=location.hash.slice(1)||'map',m;
  if((m=h.match(/^card-(\d+)$/))){cardNo=+m[1];h='cards'}
  if((m=h.match(/^gate-(\d+)$/))){gateNo=+m[1];h='gates'}
  if(!['map','cards','gates','memo','guide'].includes(h))h='map';
  if(h==='memo'&&teacher)h='map';if(h==='guide'&&!teacher)h='map';
  view=h;render();window.scrollTo(0,0);
}
main.addEventListener('input',e=>{const el=e.target;if(!el.dataset.k)return;set(el.dataset.k,el.type==='checkbox'?el.checked:el.value);if(el.dataset.k==='memo_cell')toast('今いるコマを記録しました')});
main.addEventListener('change',e=>{const el=e.target;if(el.dataset.k&&(el.type==='checkbox'||el.tagName==='SELECT'))set(el.dataset.k,el.type==='checkbox'?el.checked:el.value)});
main.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.cell){const id=t.dataset.cell;sel=sel===id?null:id;main.querySelectorAll('.cell').forEach(c=>c.setAttribute('aria-expanded',c.dataset.cell===sel));const dt=document.getElementById('detail');dt.innerHTML=sel?detail(sel):'';if(sel&&window.innerWidth<900)dt.scrollIntoView({block:'start'});return}
  if(t.dataset.card){cardNo=+t.dataset.card;history.replaceState(null,'','#card-'+cardNo);render();return}
  if(t.dataset.gate!==undefined){gateNo=+t.dataset.gate;history.replaceState(null,'',gateNo?'#gate-'+gateNo:'#gates');render();return}
  if(t.dataset.here){set('memo_cell',t.dataset.here);toast('「今ここ」にしました');render();return}
  if(t.hasAttribute('data-snap')){const e2={date:new Date().toLocaleString('ja-JP'),cell:get('memo_cell')};MEMO.forEach(([k])=>e2[k]=get(k));e2.memo_theme=get('memo_theme');const hs=Array.isArray(store.memo_hist)?store.memo_hist:[];hs.push(e2);set('memo_hist',hs);toast('日付をつけて残しました');render();return}
  if(t.dataset.copy==='gate'){copy(gateText(gateOf(gateNo)));return}
  if(t.dataset.copy==='memo'){copy(memoText());return}
  if(t.dataset.copy==='local'){copy(LOCAL.map(([a],j)=>`${a}\n${get('local_'+j)}`).join('\n\n'));return}
  if(t.dataset.clear){const p=t.dataset.clear;if(armed!==p){armed=p;t.textContent='もう一度押すと消えます';setTimeout(()=>{if(armed===p){armed=null;t.textContent='このシートを消す'}},3000);return}
    Object.keys(store).forEach(k=>{if(k.startsWith(p))delete store[k]});save();armed=null;toast('消しました');render()}
});
document.getElementById('mS').addEventListener('click',()=>{teacher=false;set('mode','s');route()});
document.getElementById('mT').addEventListener('click',()=>{teacher=true;set('mode','t');route()});
window.addEventListener('hashchange',route);
route();
}
</script></body></html>
